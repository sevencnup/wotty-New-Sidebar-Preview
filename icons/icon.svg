<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgb(96,110,230)"/>
      <stop offset="1" stop-color="rgb(56,70,180)"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>
  <!-- 右侧滑出面板 -->
  <rect x="72" y="20" width="44" height="88" rx="8" ry="8" fill="#ffffff"/>
  <!-- 顶栏分隔线 -->
  <line x1="72" y1="36" x2="116" y2="36" stroke="#e3e3e6" stroke-width="1.5"/>
  <!-- 红色多边形箭头：从左侧指向面板(向右) -->
